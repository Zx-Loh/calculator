<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculator</title>
        <link href="style.css" rel="stylesheet">
    </head>

    <body>
        <div class="container" id="max">
            <div class="container vertical" id="calculator">
                <div class="items container" id="display">
                    12345 + 6789
                </div>
                <div class="items container vertical" id="buttons">
                    <div class="container items">
                        <div class="items button center">7</div>
                        <div class="items button center">8</div>
                        <div class="items button center">9</div>
                        <div class="items button center">/</div>
                    </div>
                    <div class="container items">
                        <div class="items button center">4</div>
                        <div class="items button center">5</div>
                        <div class="items button center">6</div>
                        <div class="items button center">x</div>
                    </div>
                    <div class="container items">
                        <div class="items button center">1</div>
                        <div class="items button center">2</div>
                        <div class="items button center">3</div>
                        <div class="items button center">-</div>
                    </div>
                    <div class="container items">
                        <div class="items button center">0</div>
                        <div class="items button center">Clear</div>
                        <div class="items button center">=</div>
                        <div class="items button center">+</div>
                    </div>
                </div>
            </div>
        </div>
    </body>

    <script src="javascript.js"></script>
</html>
